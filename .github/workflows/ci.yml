name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # gnome-extensions ships in Fedora's gnome-shell package.
    container: fedora:latest
    steps:
      - name: Install build tools
        run: dnf -y install --setopt=install_weak_deps=False gnome-shell glib2 gettext make unzip

      - uses: actions/checkout@v7

      - name: Validate schemas
        run: make schemas

      - name: Pack extension
        run: make pack

      - name: List bundle contents
        run: unzip -l *.shell-extension.zip

      - uses: actions/upload-artifact@v7
        with:
          name: shell-extension
          path: '*.shell-extension.zip'
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shell-extension

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" *.shell-extension.zip
          --repo "$GITHUB_REPOSITORY" --generate-notes
